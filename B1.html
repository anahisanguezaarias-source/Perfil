<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Operaciones Básicas</title>

<style>
    body {
        background: #0f2c33;
        font-family: Arial;
        text-align: center;
        color: white;
    }

    input {
        padding: 10px;
        margin: 10px;
        border-radius: 5px;
        border: none;
        width: 150px;
    }

    button {
        padding: 10px 15px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        background: #00c9d6;
        cursor: pointer;
    }

    button:hover {
        background: #00aab5;
    }

    h1 {
        margin-top: 30px;
    }
</style>
</head>

<body>

<h1>Operaciones Básicas</h1>

<input type="number" id="num1" placeholder="Número 1">
<input type="number" id="num2" placeholder="Número 2">

<br>

<button onclick="sumar()">Sumar</button>
<button onclick="restar()">Restar</button>
<button onclick="multiplicar()">Multiplicar</button>
<button onclick="dividir()">Dividir</button>

<h2 id="resultado"></h2>

<script>
function obtenerValores() {
    let n1 = parseFloat(document.getElementById("num1").value);
    let n2 = parseFloat(document.getElementById("num2").value);
    return [n1, n2];
}

function sumar() {
    let [n1, n2] = obtenerValores();
    document.getElementById("resultado").innerText = "Resultado: " + (n1 + n2);
}

function restar() {
    let [n1, n2] = obtenerValores();
    document.getElementById("resultado").innerText = "Resultado: " + (n1 - n2);
}

function multiplicar() {
    let [n1, n2] = obtenerValores();
    document.getElementById("resultado").innerText = "Resultado: " + (n1 * n2);
}

function dividir() {
    let [n1, n2] = obtenerValores();
    if (n2 === 0) {
        document.getElementById("resultado").innerText = "No se puede dividir entre 0";
    } else {
        document.getElementById("resultado").innerText = "Resultado: " + (n1 / n2);
    }
}
</script>

</body>
</html>
